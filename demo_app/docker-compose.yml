x-app: &app
  build:
    context: ..
    dockerfile: demo_app/Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 10

  payments:
    <<: *app
    command: uvicorn demo_app.payments:app --host 0.0.0.0 --port 8002
    environment:
      SERVICE_NAME: payments
      APP_VERSION: v1.0.0
    ports:
      - "8002:8002"

  orders:
    <<: *app
    command: uvicorn demo_app.orders:app --host 0.0.0.0 --port 8001
    environment:
      SERVICE_NAME: orders
      APP_VERSION: v1.0.0
      DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
      PAYMENTS_URL: http://payments:8002
      DB_POOL_MAX: "5"
    depends_on:
      postgres:
        condition: service_healthy
      payments:
        condition: service_started
    ports:
      - "8001:8001"

  api-gateway:
    <<: *app
    command: uvicorn demo_app.gateway:app --host 0.0.0.0 --port 8000
    environment:
      SERVICE_NAME: api-gateway
      APP_VERSION: v1.0.0
      ORDERS_URL: http://orders:8001
    depends_on:
      - orders
    ports:
      - "8000:8000"

  traffic:
    <<: *app
    command: python -m demo_app.traffic
    environment:
      TARGET_URL: http://api-gateway:8000
      RPS: "2"
    depends_on:
      - api-gateway

volumes:
  pgdata:
