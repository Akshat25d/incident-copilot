groups:
  - name: shop
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[1m]))
            / sum by (service) (rate(http_requests_total[1m])) > 0.2
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }}: more than 20% of requests are failing"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le, service) (rate(http_request_duration_seconds_bucket[1m]))) > 1
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }}: p95 latency above 1 second"

      - alert: HighMemory
        expr: process_resident_memory_bytes > 262144000
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }}: memory above 250 MiB"

      - alert: ServiceDown
        expr: up == 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is not responding to scrapes"
