[project]
name = "incident-copilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
demo = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary,pool]>=3.3.8",
    "uvicorn[standard]>=0.54.0",
]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev", "demo"]
